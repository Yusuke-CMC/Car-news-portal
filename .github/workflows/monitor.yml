name: 新車情報 毎日自動チェック・自動掲載

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なライブラリをインストール
        run: pip install feedparser beautifulsoup4 requests

      - name: 監視スクリプトを実行（新着はcars.jsonに自動追記される）
        run: python monitor/monitor.py

      - name: 新着があったか確認
        id: check
        run: |
          if git diff --quiet -- cars.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 自動掲載した内容をIssueで記録（通知のみ・対応不要）
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "本日、以下の新着記事を自動検知し、cars.json に自動追記・自動公開しました。"
            echo "対応は不要です。内容を修正したい場合のみ cars.json を直接編集してください。"
            echo
            echo '```json'
            cat monitor/new_entries_template.json
            echo '```'
          } > issue_body.txt
          gh issue create \
            --title "新車情報を自動掲載しました $(date -u +%Y-%m-%d)" \
            --body-file issue_body.txt

     - name: 実行結果（cars.json・state・履歴）をコミット
        run: |
          git config user.name "car-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cars.json
          [ -f monitor/state.json ] && git add monitor/state.json
          [ -f monitor/review_queue.csv ] && git add monitor/review_queue.csv
          [ -f monitor/new_entries_template.json ] && git add monitor/new_entries_template.json
          git diff --cached --quiet || git commit -m "chore: 新着車種情報を自動掲載 ($(date -u +%Y-%m-%d))"
          git push
