<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>クルマ速報ボード | 全メーカー新車情報ポータル</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2430;
    --paper:#f2f3ef;
    --paper-dim:#e7e8e2;
    --steel:#3b5b74;
    --steel-dark:#2a4356;
    --tag-yellow:#f2b705;
    --alert:#c1443c;
    --line:#c9cdc4;
  }
  html,body{ background:var(--paper); font-family:'Noto Sans JP',sans-serif; color:var(--ink); }
  .font-display{ font-family:'Barlow Condensed','Noto Sans JP',sans-serif; letter-spacing:0.01em; }
  .font-mono{ font-family:'JetBrains Mono',monospace; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#b7bcb0; border-radius:4px; }

  .board-line{ background-image: linear-gradient(90deg, var(--line) 0, var(--line) 6px, transparent 6px, transparent 12px); background-size: 12px 1px; background-repeat:repeat-x; }

  .plate{ position:relative; background:#fff; border:1px solid var(--line); }
  .plate::before{
    content:""; position:absolute; top:-7px; left:50%; transform:translateX(-50%);
    width:14px; height:14px; border-radius:999px; background:var(--paper);
    border:1px solid var(--line); box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 4px var(--line);
  }
  .perforation{ border-top:2px dashed var(--line); }

  .stamp{
    transform: rotate(-8deg);
  }

  @keyframes ticker { from{ transform:translateX(0);} to{ transform:translateX(-50%);} }
  .ticker-track{ animation: ticker 28s linear infinite; white-space:nowrap; }
  .ticker-wrap:hover .ticker-track{ animation-play-state: paused; }

  .focus-ring:focus-visible{ outline:3px solid var(--steel); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    .ticker-track{ animation:none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

/* ---------------- サンプルデータ（デモ用。実データ連携前のプレースホルダーです） ---------------- */

const MAKERS = [

const MARKETS = ["国内","グローバル"];

const makerOf = id => MAKERS.find(m=>m.id===id);

const RAW = [
  { id:1, maker:"nissan", name:"エルグランド", cat:"ミニバン", date:"2026-07-16", type:"フルモデルチェンジ",

    specs:{ 全長:"4,995mm", 全幅:"1,895mm", ホイールベース:"3,000mm", 価格帯:"689.7〜757.9万円", 発売:"2026年7月16日" },
    source:"https://global.nissannews.com/ja-JP/releases/260716-01-j", market:"国内" },
  { id:2, maker:"nissan", name:"テクトン", cat:"SUV", date:"2026-07-09", type:"新型発表",
    summary:"インドでのワールドプレミアで発表された新型SUV。日産の事業変革における重要モデルと位置づけられている（国内導入時期は今後発表予定）。",
    specs:{ 発表:"インドにて世界初公開", 発売:"国内時期未定" },

  { id:5, maker:"toyota", name:"ハリアー", cat:"SUV", date:"2026-08-03", type:"一部改良",
    summary:"一部改良を実施し8月3日に発売。主力SUVとして商品力を継続的に更新。",
    specs:{ 発売:"2026年8月3日" },

  { id:6, maker:"toyota", name:"シエンタ", cat:"ミニバン", date:"2026-08-03", type:"一部改良",
    summary:"一部改良を実施し8月3日に発売。コンパクトミニバンとして使い勝手を継続的に更新。",
    specs:{ 発売:"2026年8月3日" },
    source:"https://global.toyota/jp/newsroom/toyota/44698107.html", market:"国内" },
  { id:7, maker:"toyota", name:"アクア", cat:"コンパクト", date:"2026-07-06", type:"一部改良",
    summary:"一部改良に合わせてスポーティなGR SPORTグレードを追加し、7月6日に発売。",
    specs:{ 発売:"2026年7月6日", 追加グレード:"GR SPORT" },

    specs:{ 発売:"2026年6月25日" },

/* ---------------- ユーティリティ ---------------- */

function daysAgoNum(dateStr){
  const d = new Date(dateStr + "T00:00:00+09:00");
  const now = new Date("2026-08-05T09:00:00+09:00");
  return Math.round((now - d) / (1000*60*60*24));
}

function daysAgo(dateStr){
  const diff = daysAgoNum(dateStr);
  if(diff <= 0) return "本日";
  if(diff === 1) return "昨日";
  return `${diff}日前`;
}

const TYPE_STYLE = {
  "新型発表": { bg:"#1c2430", fg:"#fff" },
  "フルモデルチェンジ": { bg:"#c1443c", fg:"#fff" },
  "一部改良": { bg:"#e7e8e2", fg:"#1c2430" },
};

/* ---------------- コンポーネント ---------------- */

function TopTicker(){
  const items = [...RAW].sort((a,b)=> a.date < b.date ? 1 : -1).slice(0,8);
  const line = items.map(it => `${makerOf(it.maker).name} 「${it.name}」${it.type} (${it.date})`).join("　◆　");
  return (
    <div className="ticker-wrap bg-[var(--ink)] text-[var(--paper)] overflow-hidden border-b-2" style={{borderColor:"var(--tag-yellow)"}}>
      <div className="flex items-center h-9">
        <div className="flex-shrink-0 px-3 h-full flex items-center font-display font-bold text-sm tracking-widest" style={{background:"var(--tag-yellow)", color:"var(--ink)"}}>
          最新速報
        </div>
        <div className="overflow-hidden flex-1">
          <div className="ticker-track font-mono text-xs inline-block py-2 pl-6">
            <span>{line}　◆　{line}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function Header({query, setQuery}){
  return (
    <header className="bg-[var(--paper)] border-b" style={{borderColor:"var(--line)"}}>
      <div className="max-w-6xl mx-auto px-4 md:px-6 py-5 flex flex-col md:flex-row md:items-end md:justify-between gap-4">
        <div>
          <div className="flex items-baseline gap-3">
            <h1 className="font-display font-800 text-4xl md:text-5xl tracking-tight" style={{color:"var(--ink)"}}>
              クルマ速報ボード
            </h1>
            <span className="font-mono text-xs px-2 py-1 rounded" style={{background:"var(--tag-yellow)"}}>BETA</span>
          </div>
          <p className="text-sm mt-1" style={{color:"#5b6470"}}>国内主要メーカーの新車発表・改良情報を1枚のボードに。多メーカー取扱店の情報収集を効率化します。</p>
        </div>
        <div className="w-full md:w-72">
          <label className="sr-only" htmlFor="search">車種名・メーカー名で検索</label>
          <input
            id="search"
            type="text"
            value={query}
            onChange={e=>setQuery(e.target.value)}
            placeholder="車種名・メーカー名で検索"
            className="focus-ring w-full px-3 py-2 border rounded text-sm bg-white"
            style={{borderColor:"var(--line)"}}
          />
        </div>
      </div>
    </header>
  );
}

function FilterBar({selectedMakers, toggleMaker, selectedCat, setSelectedCat, selectedMarket, setSelectedMarket, sortOrder, setSortOrder, resultCount}){
  return (
    <div className="max-w-6xl mx-auto px-4 md:px-6 py-4">
      <div className="flex flex-wrap gap-2 mb-3">
        {MAKERS.map(m=>{
          const active = selectedMakers.includes(m.id);
          return (
            <button
              key={m.id}
              onClick={()=>toggleMaker(m.id)}
              className="focus-ring font-display font-700 text-sm px-3 py-1 rounded border transition"
              style={{
                borderColor: active ? m.color : "var(--line)",
                background: active ? m.color : "#fff",
                color: active ? "#fff" : "var(--ink)",
              }}
            >
              {m.name}
            </button>
          );
        })}
      </div>
      <div className="flex flex-wrap items-center gap-3 justify-between">
        <div className="flex flex-wrap gap-2 items-center">
          <span className="text-xs" style={{color:"#5b6470"}}>カテゴリ:</span>
          <select
            value={selectedCat}
            onChange={e=>setSelectedCat(e.target.value)}
            className="focus-ring text-sm border rounded px-2 py-1 bg-white"
            style={{borderColor:"var(--line)"}}
          >
            <option value="">カテゴリ: すべて</option>
            {CATEGORIES.map(c=> <option key={c} value={c}>{c}</option>)}
          </select>
          <select
            value={selectedMarket}
            onChange={e=>setSelectedMarket(e.target.value)}
            className="focus-ring text-sm border rounded px-2 py-1 bg-white"
            style={{borderColor:"var(--line)"}}
          >
            <option value="">対象: すべて</option>
            {MARKETS.map(m=> <option key={m} value={m}>{m}のみ</option>)}
          </select>
          <select
            value={sortOrder}
            onChange={e=>setSortOrder(e.target.value)}
            className="focus-ring text-sm border rounded px-2 py-1 bg-white"
            style={{borderColor:"var(--line)"}}
          >
            <option value="new">並び替え: 新着順</option>
            <option value="old">並び替え: 古い順</option>
            <option value="domestic_first">並び替え: 国内→グローバル</option>
            <option value="global_first">並び替え: グローバル→国内</option>
          </select>
        </div>
        <span className="text-xs font-mono" style={{color:"#5b6470"}}>{resultCount}件表示中</span>
      </div>
    </div>
  );
}

function CarPlate({car, onOpen}){
  const maker = makerOf(car.maker);
  const typeStyle = TYPE_STYLE[car.type] || TYPE_STYLE["一部改良"];
  return (
    <div className="plate rounded-sm shadow-sm hover:shadow-md transition-shadow p-4 pt-6 relative flex flex-col">
      {daysAgoNum(car.date) <= 3 ? (
        <div className="stamp absolute -top-1 -right-2 font-display font-800 text-xs px-2 py-0.5 border-2 rounded"
             style={{ color:"var(--alert)", borderColor:"var(--alert)" }}>
          NEW
        </div>
      ) : null}
      <div className="flex items-center gap-2 mb-2">
        <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{background:maker.color}}></span>
        <span className="font-display font-700 text-sm tracking-wide" style={{color:maker.color}}>{maker.name}</span>
        <span className="ml-auto text-xs font-mono" style={{color:"#8a8f86"}}>{daysAgo(car.date)}</span>
      </div>
      <h3 className="font-display font-800 text-2xl leading-tight mb-1" style={{color:"var(--ink)"}}>{car.name}</h3>
      <div className="flex items-center gap-2 mb-3">
        <span className="text-xs px-2 py-0.5 rounded font-display font-700" style={{background:typeStyle.bg, color:typeStyle.fg}}>{car.type}</span>
        <span className="text-xs px-2 py-0.5 rounded border" style={{borderColor:"var(--line)", color:"#5b6470"}}>{car.cat}</span>
        {car.market === "グローバル" ? (
          <span className="text-xs px-2 py-0.5 rounded border font-mono" style={{borderColor:"var(--steel)", color:"var(--steel-dark)"}}>グローバル</span>
        ) : null}
      </div>
      <p className="text-sm mb-3 flex-1" style={{color:"#3a4048"}}>{car.summary}</p>
      <div className="perforation pt-2 mt-auto">
        <dl className="grid grid-cols-2 gap-x-2 gap-y-1 font-mono text-xs" style={{color:"#4a5058"}}>
          {Object.entries(car.specs).slice(0,4).map(([k,v])=>(
            <div key={k} className="flex justify-between border-b border-dotted pb-0.5" style={{borderColor:"var(--line)"}}>
              <dt style={{color:"#8a8f86"}}>{k}</dt><dd>{v}</dd>
            </div>
          ))}
        </dl>
      </div>
      <button
        onClick={()=>onOpen(car)}
        className="focus-ring mt-3 text-sm font-display font-700 text-left underline underline-offset-2"
        style={{color:"var(--steel-dark)"}}
      >
        詳細を見る ＞
      </button>
    </div>
  );
}

function DetailModal({car, onClose}){
  if(!car) return null;
  const maker = makerOf(car.maker);
  return (
    <div className="fixed inset-0 z-50 flex items-start md:items-center justify-center p-4 overflow-y-auto" style={{background:"rgba(28,36,48,0.55)"}}
         onClick={onClose}>
      <div className="bg-white rounded-sm max-w-lg w-full mt-8 md:mt-0 shadow-xl" onClick={e=>e.stopPropagation()}>
        <div className="p-2 flex justify-end">
          <button onClick={onClose} className="focus-ring text-sm px-2 py-1" style={{color:"#5b6470"}} aria-label="閉じる">✕ 閉じる</button>
        </div>
        <div className="px-6 pb-6">
          <div className="flex items-center gap-2 mb-1">
            <span className="w-3 h-3 rounded-full" style={{background:maker.color}}></span>
            <span className="font-display font-700" style={{color:maker.color}}>{maker.name}</span>
          </div>
          <h2 className="font-display font-800 text-3xl mb-2">{car.name}</h2>
          <div className="flex gap-2 mb-4">
            <span className="text-xs px-2 py-0.5 rounded font-display font-700" style={{background:(TYPE_STYLE[car.type]||{}).bg, color:(TYPE_STYLE[car.type]||{}).fg}}>{car.type}</span>
            <span className="text-xs px-2 py-0.5 rounded border" style={{borderColor:"var(--line)"}}>{car.cat}</span>
            <span className="text-xs px-2 py-0.5 rounded border font-mono" style={{borderColor:"var(--line)"}}>発表日 {car.date}</span>
            <span className="text-xs px-2 py-0.5 rounded border font-mono" style={{borderColor:"var(--line)"}}>{car.market}</span>
          </div>
          <p className="text-sm mb-4" style={{color:"#3a4048"}}>{car.summary}</p>
          <dl className="grid grid-cols-2 gap-x-4 gap-y-2 font-mono text-sm border-t pt-3" style={{borderColor:"var(--line)"}}>
            {Object.entries(car.specs).map(([k,v])=>(
              <div key={k} className="flex justify-between border-b border-dotted pb-1" style={{borderColor:"var(--line)"}}>
                <dt style={{color:"#8a8f86"}}>{k}</dt><dd className="font-600">{v}</dd>
              </div>
            ))}
          </dl>
          {car.source ? (
            <a href={car.source} target="_blank" rel="noopener noreferrer"
               className="focus-ring inline-block mt-4 text-sm font-display font-700 underline underline-offset-2"
               style={{color:"var(--steel-dark)"}}>
              公式発表ページを見る ＞
            </a>
          ) : null}
        </div>
      </div>
    </div>
  );
}

function EmptyState(){
  return (
    <div className="text-center py-20">
      <p className="font-display font-700 text-xl mb-1" style={{color:"var(--ink)"}}>該当する新車情報がありません</p>
      <p className="text-sm" style={{color:"#5b6470"}}>フィルターやキーワードを変更してもう一度お試しください。</p>
    </div>
  );
}

function App(){
  const [query, setQuery] = useState("");
  const [selectedMakers, setSelectedMakers] = useState([]);
  const [selectedCat, setSelectedCat] = useState("");
  const [selectedMarket, setSelectedMarket] = useState("");
  const [sortOrder, setSortOrder] = useState("new");
  const [openCar, setOpenCar] = useState(null);

  const toggleMaker = id => {
    setSelectedMakers(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);
  };

  const filtered = useMemo(()=>{
    let list = RAW.filter(car=>{
      if(selectedMakers.length && !selectedMakers.includes(car.maker)) return false;
      if(selectedCat && car.cat !== selectedCat) return false;
      if(selectedMarket && car.market !== selectedMarket) return false;
      if(query){
        const q = query.trim();
        const hay = car.name + " " + makerOf(car.maker).name;
        if(!hay.includes(q)) return false;
      }
      return true;
    });
    list = [...list].sort((a,b)=>{
      if(sortOrder === "domestic_first" || sortOrder === "global_first"){
        if(a.market !== b.market){
          const domesticFirst = sortOrder === "domestic_first";
          const aIsDomestic = a.market === "国内";
          if(domesticFirst) return aIsDomestic ? -1 : 1;
          return aIsDomestic ? 1 : -1;
        }
        return a.date < b.date ? 1 : -1;
      }
      return sortOrder === "new" ? (a.date < b.date ? 1 : -1) : (a.date > b.date ? 1 : -1);
    });
    return list;
  }, [query, selectedMakers, selectedCat, selectedMarket, sortOrder]);

  return (
    <div className="min-h-screen">
      <TopTicker />
      <Header query={query} setQuery={setQuery} />
      <FilterBar
        selectedMakers={selectedMakers}
        toggleMaker={toggleMaker}
        selectedCat={selectedCat}
        setSelectedCat={setSelectedCat}
        selectedMarket={selectedMarket}
        setSelectedMarket={setSelectedMarket}
        sortOrder={sortOrder}
        setSortOrder={setSortOrder}
        resultCount={filtered.length}
      />
      <main className="max-w-6xl mx-auto px-4 md:px-6 pb-16">
        {filtered.length === 0 ? <EmptyState/> : (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            {filtered.map(car => <CarPlate key={car.id} car={car} onOpen={setOpenCar} />)}
          </div>
        )}
      </main>
      <footer className="border-t py-6" style={{borderColor:"var(--line)"}}>
        <div className="max-w-6xl mx-auto px-4 md:px-6 flex flex-col md:flex-row justify-between gap-2 text-xs" style={{color:"#8a8f86"}}>
          <span>掲載メーカー数: {MAKERS.length} ／ 掲載車種数: {RAW.length}（2026年8月5日時点・手動キュレーション）</span>
          <span>各社ニュースリリースをもとに要約しています。詳細・正式な仕様は各社公式発表ページをご確認ください。</span>
        </div>
      </footer>
      <DetailModal car={openCar} onClose={()=>setOpenCar(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
